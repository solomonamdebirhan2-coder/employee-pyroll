{% extends "base.html" %}{% block title %}Change password{% endblock %}{% block content %}<section class="panel" style="max-width:480px;margin:45px auto"><h1>Create a new password</h1><p class="muted">At least 8 characters, including uppercase, lowercase, and a number.</p><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}">{% if not session.get('must_change_password') %}<label>Current password</label><input type="password" name="current_password" autocomplete="current-password" required>{% endif %}<label>New password</label><input type="password" name="new_password" autocomplete="new-password" required><label>Confirm new password</label><input type="password" name="confirm_password" autocomplete="new-password" required><button type="submit">Save password</button></form></section>{% endblock %}
